baseURL = 'https://siddhantmaharana.github.io/'
languageCode = 'en-us'
title = "Sid's Notes"
theme = "typo"

# Google analytics code
googleAnalytics = "G-xxxxxxxxx"

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "Sid's working notes"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = "Thinking out loud"
homeIntroContent = """
Working thoughts on experimentation, statistics, and making sense of the world.
"""

# Collection to display on home
homeCollectionTitle = 'Recent Notes'
homeCollection = 'posts'
homeCollectionLimit = 5

# Lists parameters
paginationSize = 100
listSummaries = false
listDateFormat = '2 Jan 2006'

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/siddhantmaharana/"


[[params.social]]
name = "github"
url = "https://github.com/siddhantmaharana"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "about"
url = "/about"

# Syntax highlight on code blocks
[markup]
[markup.highlight]
style = 'algol'

# Giscus comments
[params.giscus]
enable = false
repo = "user/repo"
repoid = "repoId"
category = "General"
categoryid = "categoryId"
mapping = "pathname"
theme = "preferred_color_scheme"